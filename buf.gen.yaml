version: v2
plugins:
  # Generate for the app (API) service.
  - local: ./node_modules/.bin/protoc-gen-ts_proto
    out: src/generated
    opt:
      - outputServices=grpc-js
      - esModuleInterop=true
      - env=node
      - useOptionals=messages
      - forceLong=number
  # Generate the same contract for the notifier service package.
  - local: ./node_modules/.bin/protoc-gen-ts_proto
    out: services/notifier/src/generated
    opt:
      - outputServices=grpc-js
      - esModuleInterop=true
      - env=node
      - useOptionals=messages
      - forceLong=number
