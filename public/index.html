<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Release Notifier</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
    }

    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .logo svg { width: 32px; height: 32px; fill: #e6edf3; }
    h1 { font-size: 1.4rem; font-weight: 600; }
    p.sub { font-size: 0.9rem; color: #8b949e; margin-top: 4px; }

    .form { margin-top: 28px; display: flex; flex-direction: column; gap: 16px; }

    label { font-size: 0.85rem; font-weight: 500; color: #8b949e; display: block; margin-bottom: 6px; }

    input {
      width: 100%;
      padding: 10px 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #58a6ff; }
    input::placeholder { color: #484f58; }

    button {
      padding: 11px;
      background: #238636;
      border: 1px solid #2ea043;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2ea043; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
    }
    .message.success { background: #0d2818; border: 1px solid #2ea043; color: #3fb950; display: block; }
    .message.error   { background: #2d0f0f; border: 1px solid #da3633; color: #f85149; display: block; }

    .hint { margin-top: 16px; font-size: 0.8rem; color: #8b949e; }
    .hint code { background: #0d1117; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
          -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
          .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
          -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
          1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
          1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
          1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <div>
        <h1>Release Notifier</h1>
        <p class="sub">Get email alerts for new GitHub releases</p>
      </div>
    </div>

    <div class="form">
      <div>
        <label for="repo">Repository</label>
        <input id="repo" type="text" placeholder="e.g. golang/go" autocomplete="off" />
      </div>
      <div>
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" />
      </div>
      <button id="btn" onclick="subscribe()">Subscribe to releases</button>
    </div>

    <div id="msg" class="message"></div>

    <div class="hint">
      Format: <code>owner/repo</code> &nbsp;·&nbsp; A confirmation email will be sent to verify your address.
    </div>
  </div>

  <script>
    async function subscribe() {
      const repo  = document.getElementById('repo').value.trim();
      const email = document.getElementById('email').value.trim();
      const btn   = document.getElementById('btn');

      showMessage('', '');

      if (!repo || !email) {
        showMessage('error', 'Please fill in both fields.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Subscribing…';

      try {
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, repo }),
        });

        const data = await res.json();

        if (res.ok) {
          showMessage('success', `✓ Check your inbox at ${email} to confirm the subscription.`);
          document.getElementById('repo').value = '';
          document.getElementById('email').value = '';
        } else {
          showMessage('error', data.error || 'Something went wrong.');
        }
      } catch {
        showMessage('error', 'Network error. Please check your connection.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Subscribe to releases';
      }
    }

    function showMessage(type, text) {
      const msg = document.getElementById('msg');
      msg.className = type ? `message ${type}` : 'message';
      msg.textContent = text;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') subscribe();
    });
  </script>
</body>
</html>
